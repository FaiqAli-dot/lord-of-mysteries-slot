name: CI

on:
  pull_request:
  push:
    branches: [main, 'cursor/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + RTP smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & API tests
        run: npm test
      - name: Seeded RTP smoke (100k spins)
        run: npm run simulate:smoke
      - name: Build frontend (Pages base path)
        env:
          VITE_BASE: /lord-of-mysteries-slot/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build
