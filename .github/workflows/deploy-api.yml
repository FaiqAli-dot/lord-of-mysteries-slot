name: Deploy API (Fly.io)

# Optional Node API deploy. GitHub Pages cannot run a backend — this targets Fly.io.
# Requires repo secret FLY_API_TOKEN. Without it, the job exits successfully as a no-op.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/config/**'
      - 'src/engine/**'
      - 'src/api/publicState.ts'
      - 'Dockerfile'
      - 'fly.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Detect Fly token
        id: fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN not set — skipping API deploy (Pages frontend is independent)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.fly.outputs.present == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.fly.outputs.present == 'true'
      - name: Deploy to Fly.io
        if: steps.fly.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
